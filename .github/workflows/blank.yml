name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
        cache: 'gradle'

    - name: Inject Gemini API key into .env and local.properties
      env:
        SECRET_GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        SECRET_GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
        SECRET_GOOGLE_GEMINI_API_KEY: ${{ secrets.GOOGLE_GEMINI_API_KEY }}
        SECRET_GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        SECRET_API_KEY: ${{ secrets.API_KEY }}
      run: |
        KEY="$SECRET_GEMINI_API_KEY"
        if [ -z "$KEY" ]; then KEY="$SECRET_GEMINI_KEY"; fi
        if [ -z "$KEY" ]; then KEY="$SECRET_GOOGLE_GEMINI_API_KEY"; fi
        if [ -z "$KEY" ]; then KEY="$SECRET_GOOGLE_API_KEY"; fi
        if [ -z "$KEY" ]; then KEY="$SECRET_API_KEY"; fi

        echo "GEMINI_API_KEY=$KEY" > .env
        echo "GEMINI_API_KEY=$KEY" >> .env.example
        touch local.properties
        echo "GEMINI_API_KEY=$KEY" >> local.properties
        echo "GEMINI_API_KEY successfully prepared (key length: ${#KEY})"

    - name: Configure google-services.json
      env:
        GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
      run: |
        mkdir -p app
        if [ -n "$GOOGLE_SERVICES_JSON" ]; then
          echo "$GOOGLE_SERVICES_JSON" > app/google-services.json
          echo "Real google-services.json successfully configured from GitHub Secrets."
        else
          cat > app/google-services.json << 'EOF'
        {
          "project_info": {
            "project_number": "000000000000",
            "project_id": "dummy-project",
            "storage_bucket": "dummy-project.appspot.com"
          },
          "client": [
            {
              "client_info": {
                "mobilesdk_app_id": "1:000000000000:android:0000000000000000",
                "android_client_info": {
                  "package_name": "com.aistudio.pawpalai.qwkzrv"
                }
              },
              "oauth_client": [],
              "api_key": [
                {
                  "current_key": "dummy"
                }
              ],
              "services": {
                "appinvite_service": {
                  "other_platform_oauth_client": []
                }
              }
            }
          ],
          "configuration_version": "1"
        }
        EOF
          echo "Fallback dummy google-services.json created."
        fi

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Run unit tests
      run: ./gradlew test --continue || true

    - name: Build APK (Debug)
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || secrets.GEMINI_KEY || secrets.GOOGLE_GEMINI_API_KEY || secrets.GOOGLE_API_KEY || secrets.API_KEY }}
      run: ./gradlew assembleDebug --stacktrace

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/app-debug.apk
